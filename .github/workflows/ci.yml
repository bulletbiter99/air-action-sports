# Repo-wide CI for the Air Action Sports Worker. Runs on every PR targeting
# main or any milestone-* / milestone/* branch.
#
# Two parallel jobs:
#   * test    — lint (blocking) + vitest with v8 coverage (M4 B1a baseline:
#               674 unit tests across 83 files; coverage HTML uploaded as
#               artifact for 14 days)
#   * visual  — Playwright public visual-regression suite (M4 B1b; converted
#               2026-07-02 to local-serve + route-mock — it no longer touches
#               production). Pixel diffs > 1% fail the PR; HTML report + diff
#               PNGs uploaded on failure.
#
# What this does NOT do:
#   * Playwright `npm run test:e2e` — operator-triggered against a deployed
#                                       Worker. Smoke suite, separate from visual.
#   * `wrangler deploy` — Cloudflare deploy is a separate workflow / a
#                          push-to-main hook on the dashboard side.
#   * Coverage thresholds — measurement only; gating comes in a later milestone.
#   * Baseline capture — the .github/workflows/capture-baselines.yml
#                          workflow handles that on PRs labeled `capture-baselines`.

name: CI

on:
  pull_request:
    branches:
      - main
      - 'milestone-*'
      - 'milestone/**'

# Cancel an in-flight run when the same PR gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest + coverage (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint is BLOCKING as of M3 batch 0 — eslint.config.js (flat config)
      # landed; closes audit pain-point #8. Errors fail the PR; warnings
      # remain (253 inherited warnings; new code is held to "no new warnings"
      # informally per code review).
      - name: Lint (blocking)
        run: npm run lint

      - name: Run vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  visual:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      # Runs playwright.public.config.js (via the npm script): builds + serves
      # the SPA locally and route-mocks /api/* with representative fixtures —
      # same harness shape as the admin suite below. Converted 2026-07-02 from
      # live-prod capture because /api/events never loaded from GitHub runners
      # (every baseline showed the events error state — zero event-content
      # coverage). FAILS when baselines are missing or drift — label the PR
      # `capture-baselines` to (re)capture. See docs/runbooks/visual-regression.md.
      - name: Run visual regression suite
        run: npm run test:visual

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: test-results/
          retention-days: 14

  visual-admin:
    name: Admin visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      # Both suites now serve the BUILT SPA locally and route-mock their APIs —
      # the public suite was converted to that pattern on 2026-07-02 (#371), so
      # the old "the public job hits production" contrast no longer holds. This
      # admin suite serves the BUILT SPA locally — the config's webServer runs
      # `npm run build && npm run preview` — and route-mocks the admin API so the
      # shell authenticates as an owner with deterministic empty data. Like the
      # public job, this FAILS on the suite-introducing PR (M7 B9) until
      # baselines exist: label the PR `capture-baselines` to seed them.
      # See docs/runbooks/visual-regression.md.
      - name: Run admin visual regression suite
        run: npm run test:visual:admin

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-admin-report
          path: playwright-report/
          retention-days: 14

      - name: Upload admin visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-admin-diffs
          path: test-results/
          retention-days: 14
